<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Room — Thinkers GK</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface-2: #1e293b;
    --border: #1e293b;
    --border-active: #334155;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.2);
    --claude: #f59e0b;
    --claude-bg: rgba(245, 158, 11, 0.08);
    --claude-border: rgba(245, 158, 11, 0.2);
    --codex: #10b981;
    --codex-bg: rgba(16, 185, 129, 0.08);
    --codex-border: rgba(16, 185, 129, 0.2);
    --user: #3b82f6;
    --user-bg: rgba(59, 130, 246, 0.08);
    --user-border: rgba(59, 130, 246, 0.2);
    --jeff: #ec4899;
    --jeff-bg: rgba(236, 72, 153, 0.08);
    --jeff-border: rgba(236, 72, 153, 0.2);
    --gemini: #8b5cf6;
    --gemini-bg: rgba(139, 92, 246, 0.08);
    --gemini-border: rgba(139, 92, 246, 0.2);
    --notebooklm: #14b8a6;
    --notebooklm-bg: rgba(20, 184, 166, 0.08);
    --notebooklm-border: rgba(20, 184, 166, 0.2);
    --open: #3b82f6;
    --disputed: #f59e0b;
    --resolved: #10b981;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .sidebar-header h1::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .sidebar-header p {
    margin-top: 0.35rem;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .sidebar-actions {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0.5rem;
  }

  .btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border-active);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { border-color: var(--accent); background: var(--accent-glow); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.76rem; }
  .btn-export { margin-left: auto; }

  .thread-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }

  .thread-item {
    padding: 0.85rem 1rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 2px;
  }

  .thread-item:hover { background: var(--surface-2); }
  .thread-item.active { background: var(--accent-glow); border: 1px solid rgba(99, 102, 241, 0.3); }

  .thread-item-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }

  .thread-topic {
    font-weight: 600;
    font-size: 0.88rem;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-badge {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
  }

  .status-open { background: rgba(59, 130, 246, 0.15); color: var(--open); }
  .status-disputed { background: rgba(245, 158, 11, 0.15); color: var(--disputed); }
  .status-resolved { background: rgba(16, 185, 129, 0.15); color: var(--resolved); }

  .thread-meta {
    font-size: 0.74rem;
    color: var(--text-muted);
    display: flex;
    gap: 0.75rem;
  }

  .main {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    height: 100vh;
    overflow: hidden;
  }

  .main-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .thread-header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .thread-header h2 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    flex: 1;
  }

  .thread-header-actions {
    display: flex;
    gap: 0.5rem;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .message {
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 1rem 1.25rem;
    max-width: 85%;
    position: relative;
  }

  .message.author-claude {
    background: var(--claude-bg);
    border-color: var(--claude-border);
    align-self: flex-start;
  }

  .message.author-codex {
    background: var(--codex-bg);
    border-color: var(--codex-border);
    align-self: flex-end;
  }

  .message.author-user {
    background: var(--user-bg);
    border-color: var(--user-border);
    align-self: center;
    max-width: 90%;
  }

  .message.author-jeff {
    background: var(--jeff-bg);
    border-color: var(--jeff-border);
    align-self: flex-start;
  }

  .message.author-gemini {
    background: var(--gemini-bg);
    border-color: var(--gemini-border);
    align-self: flex-end;
  }

  .message.author-notebooklm {
    background: var(--notebooklm-bg);
    border-color: var(--notebooklm-border);
    align-self: flex-start;
  }

  .message-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.65rem;
  }

  .author-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-claude { background: var(--claude); }
  .dot-codex { background: var(--codex); }
  .dot-user { background: var(--user); }
  .dot-jeff { background: var(--jeff); }
  .dot-gemini { background: var(--gemini); }
  .dot-notebooklm { background: var(--notebooklm); }

  .message-author {
    font-weight: 700;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .name-claude { color: var(--claude); }
  .name-codex { color: var(--codex); }
  .name-user { color: var(--user); }
  .name-jeff { color: var(--jeff); }
  .name-gemini { color: var(--gemini); }
  .name-notebooklm { color: var(--notebooklm); }

  .message-position {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--text-muted);
  }

  .message-time {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-left: auto;
  }

  .message-content {
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message-refs {
    margin-top: 0.65rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .message-ref {
    font-size: 0.72rem;
    font-family: var(--mono);
    padding: 0.2rem 0.5rem;
    border-radius: 5px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .decisions {
    padding: 0.75rem 2rem;
    border-top: 1px solid var(--border);
    background: rgba(16, 185, 129, 0.04);
  }

  .decisions h3 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--resolved);
    margin-bottom: 0.5rem;
  }

  .decision-item {
    font-size: 0.88rem;
    line-height: 1.7;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    white-space: pre-wrap;
  }

  .decision-item:last-child { border-bottom: none; }

  .decision-by {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }

  .compose {
    padding: 1rem 2rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .compose-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .compose select, .compose input, .compose textarea {
    background: var(--surface-2);
    border: 1px solid var(--border-active);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.85rem;
    padding: 0.5rem 0.75rem;
  }

  .compose select { width: 120px; }
  .compose select:nth-child(2) { width: 140px; }

  .compose textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
  }

  .compose-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.5rem;
  }

  .compose-hint {
    font-size: 0.74rem;
    color: var(--text-muted);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-active);
    border-radius: 16px;
    padding: 1.5rem;
    width: 420px;
    max-width: 90vw;
  }

  .modal h3 {
    font-size: 1rem;
    margin-bottom: 1rem;
  }

  .modal input, .modal textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border-active);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.85rem;
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.75rem;
  }

  .modal textarea { min-height: 60px; resize: vertical; }

  .modal-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 0.5rem;
  }

  .refresh-indicator {
    font-size: 0.7rem;
    color: var(--text-muted);
    padding: 0.5rem 1.5rem;
    text-align: center;
    border-top: 1px solid var(--border);
  }

  .turn-banner {
    padding: 0.75rem 2rem;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.65rem;
    border-bottom: 1px solid var(--border);
  }

  .turn-banner.waiting-claude {
    background: var(--claude-bg);
    border-bottom-color: var(--claude-border);
    color: var(--claude);
  }

  .turn-banner.waiting-codex {
    background: var(--codex-bg);
    border-bottom-color: var(--codex-border);
    color: var(--codex);
  }

  .turn-banner .turn-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: turnPulse 1.5s ease-in-out infinite;
  }

  .waiting-claude .turn-dot { background: var(--claude); }
  .waiting-codex .turn-dot { background: var(--codex); }

  @keyframes turnPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .converge-banner {
    padding: 0.75rem 2rem;
    font-size: 0.85rem;
    font-weight: 600;
    background: rgba(16, 185, 129, 0.1);
    border-bottom: 1px solid rgba(16, 185, 129, 0.3);
    color: var(--resolved);
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .round-counter {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text-muted);
  }

  .turn-tag {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    margin-left: 0.35rem;
  }

  .turn-tag-claude { background: var(--claude-bg); color: var(--claude); border: 1px solid var(--claude-border); }
  .turn-tag-codex { background: var(--codex-bg); color: var(--codex); border: 1px solid var(--codex-border); }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .messages { padding: 1rem; }
    .compose { padding: 0.75rem 1rem; }
    .message { max-width: 95%; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Agent Room</h1>
      <p>Team chat — AI agents &amp; human</p>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary btn-sm" onclick="showNewThread()">+ New Thread</button>
      <button class="btn btn-sm btn-export" onclick="exportDecisions()">Export</button>
    </div>
    <div class="thread-list" id="threadList"></div>
    <div class="refresh-indicator">Auto-refreshes every 3s</div>
  </div>

  <div class="main" id="mainPanel">
    <div class="main-empty">
      <div style="display:flex;flex-direction:column;gap:12px;align-items:center;">
        <div>Select a thread or create a new one</div>
        <button class="btn btn-primary btn-sm" onclick="openFirstThread()">Open latest thread</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="newThreadModal">
  <div class="modal">
    <h3>New Discussion Thread</h3>
    <input type="text" id="newTopic" placeholder="Topic (e.g. homepage-hero-design)">
    <textarea id="newDesc" placeholder="Description (optional) — what needs to be decided?"></textarea>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="hideNewThread()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="createThread()">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="resolveModal">
  <div class="modal">
    <h3>Resolve Thread</h3>
    <textarea id="resolveDecision" placeholder="Final decision — what was agreed?"></textarea>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="hideResolve()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="resolveThread()">Resolve</button>
    </div>
  </div>
</div>

<script>
const API = '';
let currentThread = null;
let autoSelected = false;

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  return res.json();
}

function buildThreadItem(t) {
  const el = document.createElement('div');
  el.className = 'thread-item' + (currentThread === t.id ? ' active' : '');
  el.onclick = function() { selectThread(t.id); };

  const header = document.createElement('div');
  header.className = 'thread-item-header';

  const topic = document.createElement('span');
  topic.className = 'thread-topic';
  topic.textContent = t.topic;

  const badge = document.createElement('span');
  badge.className = 'status-badge status-' + t.status;
  badge.textContent = t.status;

  header.appendChild(topic);
  header.appendChild(badge);

  // Turn tag in sidebar
  if (t.nextTurn && t.status !== 'resolved') {
    const turnTag = document.createElement('span');
    turnTag.className = 'turn-tag turn-tag-' + t.nextTurn;
    turnTag.textContent = t.nextTurn;
    header.appendChild(turnTag);
  }

  const meta = document.createElement('div');
  meta.className = 'thread-meta';

  const count = document.createElement('span');
  count.textContent = t.messageCount + ' messages';

  const parts = document.createElement('span');
  parts.textContent = t.participants.join(', ');

  meta.appendChild(count);
  meta.appendChild(parts);

  el.appendChild(header);
  el.appendChild(meta);
  return el;
}

async function loadThreads() {
  const threads = await api('/threads');
  const list = document.getElementById('threadList');
  list.replaceChildren();
  threads.forEach(function(t) {
    list.appendChild(buildThreadItem(t));
  });
  if (!currentThread && threads.length && !autoSelected) {
    autoSelected = true;
    const openThread = threads.find(t => t.status !== 'resolved') || threads[0];
    selectThread(openThread.id);
  }
}

function buildMessageEl(m) {
  const el = document.createElement('div');
  el.className = 'message author-' + m.author;

  const header = document.createElement('div');
  header.className = 'message-header';

  const dot = document.createElement('span');
  dot.className = 'author-dot dot-' + m.author;
  header.appendChild(dot);

  const name = document.createElement('span');
  name.className = 'message-author name-' + m.author;
  name.textContent = m.author;
  header.appendChild(name);

  if (m.position) {
    const pos = document.createElement('span');
    pos.className = 'message-position';
    pos.textContent = m.position;
    header.appendChild(pos);
  }

  const time = document.createElement('span');
  time.className = 'message-time';
  time.textContent = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  header.appendChild(time);

  el.appendChild(header);

  const content = document.createElement('div');
  content.className = 'message-content';
  content.textContent = m.content;
  el.appendChild(content);

  if (m.references && m.references.length) {
    const refs = document.createElement('div');
    refs.className = 'message-refs';
    m.references.forEach(function(r) {
      const ref = document.createElement('span');
      ref.className = 'message-ref';
      ref.textContent = r;
      refs.appendChild(ref);
    });
    el.appendChild(refs);
  }

  return el;
}

function renderThread(t) {
  const main = document.getElementById('mainPanel');
  main.replaceChildren();

  // Header
  const header = document.createElement('div');
  header.className = 'thread-header';

  const title = document.createElement('h2');
  title.textContent = t.topic;
  header.appendChild(title);

  const badge = document.createElement('span');
  badge.className = 'status-badge status-' + t.status;
  badge.textContent = t.status;
  header.appendChild(badge);

  const actions = document.createElement('div');
  actions.className = 'thread-header-actions';

  if (t.status !== 'resolved') {
    const disputeBtn = document.createElement('button');
    disputeBtn.className = 'btn btn-sm';
    disputeBtn.textContent = 'Mark Disputed';
    disputeBtn.onclick = markDisputed;
    actions.appendChild(disputeBtn);

    const resolveBtn = document.createElement('button');
    resolveBtn.className = 'btn btn-sm btn-primary';
    resolveBtn.textContent = 'Resolve';
    resolveBtn.onclick = showResolve;
    actions.appendChild(resolveBtn);
  } else {
    const reopenBtn = document.createElement('button');
    reopenBtn.className = 'btn btn-sm';
    reopenBtn.textContent = 'Reopen';
    reopenBtn.onclick = reopenThread;
    actions.appendChild(reopenBtn);
  }

  header.appendChild(actions);
  main.appendChild(header);

  // Description
  if (t.description) {
    const desc = document.createElement('div');
    desc.style.cssText = 'padding: 0.75rem 2rem; font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid var(--border);';
    desc.textContent = t.description;
    main.appendChild(desc);
  }

  // Turn / convergence banner
  if (t.status !== 'resolved') {
    var nextTurn = t.nextTurn;
    var converged = t.converged;
    var roundNum = Math.ceil((t.messages.length || 0) / 2);
    var maxRounds = t.maxRounds || 8;

    if (converged) {
      var cBanner = document.createElement('div');
      cBanner.className = 'converge-banner';
      var checkmark = document.createElement('span');
      checkmark.textContent = 'Both sides appear to agree — ready to resolve';
      cBanner.appendChild(checkmark);
      var roundInfo = document.createElement('span');
      roundInfo.className = 'round-counter';
      roundInfo.textContent = 'Round ' + roundNum + '/' + maxRounds;
      cBanner.appendChild(roundInfo);
      main.appendChild(cBanner);
    } else if (nextTurn) {
      var tBanner = document.createElement('div');
      tBanner.className = 'turn-banner waiting-' + nextTurn;
      var dot = document.createElement('span');
      dot.className = 'turn-dot';
      tBanner.appendChild(dot);
      var label = document.createElement('span');
      label.textContent = 'Waiting for ' + nextTurn.charAt(0).toUpperCase() + nextTurn.slice(1) + ' to respond...';
      tBanner.appendChild(label);
      var roundInfo2 = document.createElement('span');
      roundInfo2.className = 'round-counter';
      roundInfo2.textContent = 'Round ' + roundNum + '/' + maxRounds;
      tBanner.appendChild(roundInfo2);
      main.appendChild(tBanner);
    }
  }

  // Messages
  const msgs = document.createElement('div');
  msgs.className = 'messages';
  msgs.id = 'messages';
  t.messages.forEach(function(m) {
    msgs.appendChild(buildMessageEl(m));
  });
  main.appendChild(msgs);

  // Decisions
  if (t.decisions.length) {
    const dec = document.createElement('div');
    dec.className = 'decisions';

    const decTitle = document.createElement('h3');
    decTitle.textContent = 'Decisions';
    dec.appendChild(decTitle);

    t.decisions.forEach(function(d) {
      const item = document.createElement('div');
      item.className = 'decision-item';
      item.textContent = d.text;

      const by = document.createElement('div');
      by.className = 'decision-by';
      by.textContent = '— ' + d.decidedBy + ', ' + new Date(d.timestamp).toLocaleString();
      item.appendChild(by);

      dec.appendChild(item);
    });
    main.appendChild(dec);
  }

  // Compose (always visible)
  {
    const compose = document.createElement('div');
    compose.className = 'compose';

    const row = document.createElement('div');
    row.className = 'compose-row';

    // Author is always "user" — AI tools post programmatically
    const authorHidden = document.createElement('input');
    authorHidden.type = 'hidden';
    authorHidden.id = 'composeAuthor';
    authorHidden.value = 'user';
    row.appendChild(authorHidden);

    const authorLabel = document.createElement('span');
    authorLabel.style.cssText = 'display:flex;align-items:center;gap:6px;padding:0.5rem 0.75rem;font-size:0.85rem;font-weight:600;color:var(--user);';
    authorLabel.innerHTML = '<span class="author-dot dot-user" style="width:8px;height:8px;border-radius:50%;background:var(--user);display:inline-block;"></span> You';
    row.appendChild(authorLabel);

    // Position selector hidden — not needed for general chat
    const posHidden = document.createElement('input');
    posHidden.type = 'hidden';
    posHidden.id = 'composePosition';
    posHidden.value = '';
    row.appendChild(posHidden);
    compose.appendChild(row);

    const textarea = document.createElement('textarea');
    textarea.id = 'composeContent';
    textarea.placeholder = t.status === 'resolved'
      ? 'Thread is resolved. Reopen to send a message.'
      : 'Type a message... (also works via curl)';
    if (t.status === 'resolved') {
      textarea.disabled = true;
    }
    textarea.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    compose.appendChild(textarea);

    const footer = document.createElement('div');
    footer.className = 'compose-footer';

    const hint = document.createElement('span');
    hint.className = 'compose-hint';
    hint.textContent = 'Messages can also be posted via curl to /threads/' + t.id + '/messages';
    footer.appendChild(hint);

    if (t.status === 'resolved') {
      const reopenBtn = document.createElement('button');
      reopenBtn.className = 'btn btn-primary btn-sm';
      reopenBtn.textContent = 'Reopen to Reply';
      reopenBtn.onclick = reopenThread;
      footer.appendChild(reopenBtn);
    } else {
      const sendBtn = document.createElement('button');
      sendBtn.className = 'btn btn-primary btn-sm';
      sendBtn.textContent = 'Send';
      sendBtn.onclick = sendMessage;
      footer.appendChild(sendBtn);
    }

    compose.appendChild(footer);
    main.appendChild(compose);
  }

  msgs.scrollTop = msgs.scrollHeight;
}

async function selectThread(id) {
  currentThread = id;
  const thread = await api('/threads/' + id);
  lastMessageCount = thread.messages.length;
  renderThread(thread);
  loadThreads();
}

async function sendMessage() {
  if (!currentThread) return;
  var contentEl = document.getElementById('composeContent');
  var content = contentEl.value.trim();
  if (!content) return;
  var author = document.getElementById('composeAuthor').value;
  var position = document.getElementById('composePosition').value;

  await api('/threads/' + currentThread + '/messages', {
    method: 'POST',
    body: { author: author, content: content, position: position || undefined }
  });

  selectThread(currentThread);
}

async function markDisputed() {
  if (!currentThread) return;
  await api('/threads/' + currentThread, { method: 'PATCH', body: { status: 'disputed' } });
  selectThread(currentThread);
  loadThreads();
}

async function reopenThread() {
  if (!currentThread) return;
  await api('/threads/' + currentThread, { method: 'PATCH', body: { status: 'open' } });
  selectThread(currentThread);
  loadThreads();
}

function showNewThread() { document.getElementById('newThreadModal').classList.add('active'); }
function hideNewThread() { document.getElementById('newThreadModal').classList.remove('active'); }
function showResolve() { document.getElementById('resolveModal').classList.add('active'); }
function hideResolve() { document.getElementById('resolveModal').classList.remove('active'); }

async function createThread() {
  var topic = document.getElementById('newTopic').value.trim();
  if (!topic) return;
  var description = document.getElementById('newDesc').value.trim();

  var thread = await api('/threads', {
    method: 'POST',
    body: { topic: topic, description: description || undefined }
  });

  hideNewThread();
  document.getElementById('newTopic').value = '';
  document.getElementById('newDesc').value = '';
  await loadThreads();
  selectThread(thread.id);
}

async function resolveThread() {
  if (!currentThread) return;
  var decision = document.getElementById('resolveDecision').value.trim();
  if (!decision) return;

  await api('/threads/' + currentThread + '/resolve', {
    method: 'POST',
    body: { decision: decision, decidedBy: 'user' }
  });

  hideResolve();
  document.getElementById('resolveDecision').value = '';
  selectThread(currentThread);
  loadThreads();
}

async function exportDecisions() {
  var res = await fetch(API + '/export');
  var md = await res.text();
  var blob = new Blob([md], { type: 'text/markdown' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'design-decisions.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Auto-refresh — only update messages, never touch compose area
var lastMessageCount = 0;

async function autoRefresh() {
  await loadThreads();
  if (!currentThread) {
    const threads = await api('/threads');
    if (threads.length) {
      const openThread = threads.find(t => t.status !== 'resolved') || threads[0];
      currentThread = openThread.id;
      const thread = await api('/threads/' + currentThread);
      lastMessageCount = thread.messages.length;
      renderThread(thread);
    }
    return;
  }

  // Skip refresh entirely if user is typing
  var compose = document.getElementById('composeContent');
  if (compose && (document.activeElement === compose || compose.value.trim() !== '')) return;

  var thread = await api('/threads/' + currentThread);

  // Only re-render messages if count changed (new message arrived)
  if (thread.messages.length !== lastMessageCount) {
    var msgs = document.getElementById('messages');
    if (msgs) {
      var wasAtBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 50;
      // Only rebuild the messages container, not the whole panel
      msgs.replaceChildren();
      thread.messages.forEach(function(m) {
        msgs.appendChild(buildMessageEl(m));
      });
      lastMessageCount = thread.messages.length;
      if (wasAtBottom) msgs.scrollTop = msgs.scrollHeight;
    } else {
      // No messages container yet — full render needed (first load)
      renderThread(thread);
      lastMessageCount = thread.messages.length;
    }
  }
}

async function openFirstThread() {
  const threads = await api('/threads');
  if (!threads.length) return;
  const openThread = threads.find(t => t.status !== 'resolved') || threads[0];
  selectThread(openThread.id);
}

loadThreads();
setInterval(autoRefresh, 3000);
</script>
