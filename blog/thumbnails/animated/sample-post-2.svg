<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes barGrow{0%{transform:scaleY(0.6)}50%{transform:scaleY(1)}100%{transform:scaleY(0.6)}}
    @keyframes arrowBounce{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-8px) translateX(4px)}}
    .bar1{animation:barGrow 2.5s ease-in-out infinite;transform-origin:center bottom}
    .bar2{animation:barGrow 2.5s ease-in-out 0.3s infinite;transform-origin:center bottom}
    .bar3{animation:barGrow 2.5s ease-in-out 0.6s infinite;transform-origin:center bottom}
    .bar4{animation:barGrow 2.5s ease-in-out 0.9s infinite;transform-origin:center bottom}
    .arrow{animation:arrowBounce 3s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <!-- Chart bars -->
  <rect class="bar1" x="220" y="130" width="20" height="50" rx="3" fill="rgba(96,165,250,0.7)"/>
  <rect class="bar2" x="250" y="115" width="20" height="65" rx="3" fill="rgba(96,165,250,0.8)"/>
  <rect class="bar3" x="280" y="100" width="20" height="80" rx="3" fill="rgba(147,197,253,0.85)"/>
  <rect class="bar4" x="310" y="85" width="20" height="95" rx="3" fill="rgba(191,219,254,0.9)"/>
  <!-- Chart baseline -->
  <line x1="210" y1="180" x2="340" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Arrow icon -->
  <g class="arrow" opacity="0.8">
    <line x1="370" y1="155" x2="405" y2="100" stroke="rgba(52,211,153,0.8)" stroke-width="3" stroke-linecap="round"/>
    <polyline points="393,98 407,98 405,112" fill="none" stroke="rgba(52,211,153,0.8)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Category pill -->
  <rect x="228" y="240" width="144" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="259" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">IT INSIGHTS</text>
</svg>