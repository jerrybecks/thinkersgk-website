<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes shieldGlow { 0%,100%{filter:drop-shadow(0 0 2px rgba(96,165,250,0.3))} 50%{filter:drop-shadow(0 0 8px rgba(96,165,250,0.6))} }
    @keyframes circuitPulse { 0%,100%{opacity:.5} 30%{opacity:1} 60%{opacity:.5} }
    .shield{animation:shieldGlow 3s ease-in-out infinite}
    .circuit{animation:circuitPulse 2s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <!-- Shield icon -->
  <g class="shield">
    <path d="M250 105 L250 155 C250 175 270 190 270 190 C270 190 290 175 290 155 L290 105 L270 95 L250 105Z" fill="none" stroke="rgba(96,165,250,0.8)" stroke-width="2.5"/>
    <path d="M262 140 L270 148 L282 132" fill="none" stroke="rgba(96,165,250,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- AI brain/circuit icon -->
  <g class="circuit">
    <circle cx="345" cy="140" r="28" fill="none" stroke="rgba(147,197,253,0.6)" stroke-width="2"/>
    <circle cx="345" cy="140" r="6" fill="rgba(147,197,253,0.5)"/>
    <!-- Circuit nodes -->
    <circle cx="345" cy="112" r="3" fill="rgba(147,197,253,0.7)"/>
    <circle cx="345" cy="168" r="3" fill="rgba(147,197,253,0.7)"/>
    <circle cx="317" cy="140" r="3" fill="rgba(147,197,253,0.7)"/>
    <circle cx="373" cy="140" r="3" fill="rgba(147,197,253,0.7)"/>
    <!-- Circuit lines -->
    <line x1="345" y1="115" x2="345" y2="134" stroke="rgba(147,197,253,0.4)" stroke-width="1.5"/>
    <line x1="345" y1="146" x2="345" y2="165" stroke="rgba(147,197,253,0.4)" stroke-width="1.5"/>
    <line x1="320" y1="140" x2="339" y2="140" stroke="rgba(147,197,253,0.4)" stroke-width="1.5"/>
    <line x1="351" y1="140" x2="370" y2="140" stroke="rgba(147,197,253,0.4)" stroke-width="1.5"/>
    <!-- Outer nodes -->
    <line x1="345" y1="109" x2="345" y2="98" stroke="rgba(147,197,253,0.3)" stroke-width="1"/>
    <circle cx="345" cy="96" r="2" fill="rgba(147,197,253,0.5)"/>
    <line x1="376" y1="140" x2="387" y2="140" stroke="rgba(147,197,253,0.3)" stroke-width="1"/>
    <circle cx="390" cy="140" r="2" fill="rgba(147,197,253,0.5)"/>
    <line x1="314" y1="140" x2="303" y2="140" stroke="rgba(147,197,253,0.3)" stroke-width="1"/>
    <circle cx="300" cy="140" r="2" fill="rgba(147,197,253,0.5)"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="170" cy="85" r="1.5" fill="rgba(96,165,250,0.15)"/>
  <circle cx="430" cy="95" r="2" fill="rgba(96,165,250,0.1)"/>
  <circle cx="190" cy="200" r="1.5" fill="rgba(96,165,250,0.15)"/>
  <!-- Category pill -->
  <rect x="218" y="240" width="164" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="259" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">AI GOVERNANCE</text>
</svg>