<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes arrowDown { 0%{transform:translateY(-10px);opacity:0} 50%{opacity:1} 100%{transform:translateY(10px);opacity:0} }
    @keyframes arrowUp { 0%{transform:translateY(10px);opacity:0} 50%{opacity:1} 100%{transform:translateY(-10px);opacity:0} }
    @keyframes nodePulse { 0%,100%{r:6;fill-opacity:.8} 50%{r:8;fill-opacity:1} }
    @keyframes dataFlow { 0%{stroke-dashoffset:10} 100%{stroke-dashoffset:0} }
    .cloud{animation:float 4s ease-in-out infinite}
    .arr-d{animation:arrowDown 2s ease-in-out infinite}
    .arr-u{animation:arrowUp 2s ease-in-out infinite;animation-delay:.8s}
    .ai-core{animation:nodePulse 2s ease-in-out infinite}
    .flow{animation:dataFlow 1.5s linear infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <g class="cloud">
    <ellipse cx="270" cy="120" rx="40" ry="30" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
    <ellipse cx="320" cy="110" rx="45" ry="35" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
    <ellipse cx="360" cy="125" rx="35" ry="25" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
    <rect x="248" y="130" width="130" height="20" fill="url(#bg)"/>
    <circle class="ai-core" cx="300" cy="115" r="6" fill="rgba(96,165,250,0.8)"/>
    <circle cx="320" cy="105" r="4" fill="rgba(96,165,250,0.6)"/>
    <circle cx="340" cy="118" r="4" fill="rgba(96,165,250,0.6)"/>
    <circle cx="280" cy="108" r="4" fill="rgba(96,165,250,0.6)"/>
    <line class="flow" x1="300" y1="115" x2="320" y2="105" stroke="rgba(96,165,250,0.5)" stroke-width="1" stroke-dasharray="3,3"/>
    <line class="flow" x1="300" y1="115" x2="340" y2="118" stroke="rgba(96,165,250,0.5)" stroke-width="1" stroke-dasharray="3,3"/>
    <line class="flow" x1="300" y1="115" x2="280" y2="108" stroke="rgba(96,165,250,0.5)" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
  <g class="arr-d">
    <line x1="285" y1="160" x2="285" y2="190" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <polygon points="280,190 285,200 290,190" fill="rgba(255,255,255,0.5)"/>
  </g>
  <g class="arr-u">
    <line x1="315" y1="200" x2="315" y2="170" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <polygon points="310,170 315,160 320,170" fill="rgba(255,255,255,0.5)"/>
  </g>
  <rect x="205" y="225" width="190" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="244" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">AI &amp; CLOUD</text>
</svg>