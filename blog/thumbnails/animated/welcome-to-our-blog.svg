<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2756"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes bubbleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes penWrite{0%,100%{transform:rotate(0deg)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
    .bubble{animation:bubbleFloat 3s ease-in-out infinite}
    .pen{animation:penWrite 2s ease-in-out infinite;transform-origin:370px 150px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <!-- Speech bubble -->
  <g class="bubble" opacity="0.85">
    <rect x="210" y="80" width="80" height="55" rx="10" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
    <polygon points="235,135 245,148 255,135" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="225" y1="100" x2="275" y2="100" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
    <line x1="225" y1="110" x2="265" y2="110" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="225" y1="120" x2="255" y2="120" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Pen icon -->
  <g class="pen" opacity="0.75">
    <rect x="355" y="90" width="14" height="65" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" transform="rotate(15 362 122)"/>
    <polygon points="358,155 362,170 366,155" fill="rgba(255,255,255,0.5)" transform="rotate(15 362 162)"/>
    <rect x="355" y="88" width="14" height="12" rx="2" fill="rgba(255,255,255,0.3)" transform="rotate(15 362 94)"/>
  </g>
  <!-- Small decorative dots -->
  <circle cx="180" cy="160" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="430" cy="90" r="2.5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="420" cy="170" r="2" fill="rgba(255,255,255,0.18)"/>
  <!-- Category pill -->
  <rect x="237" y="240" width="126" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="259" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">WELCOME</text>
</svg>