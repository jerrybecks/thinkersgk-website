<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes shieldGlow { 0%,100%{stroke-opacity:.9;filter:none} 50%{stroke-opacity:1;filter:drop-shadow(0 0 6px rgba(52,211,153,.5))} }
    @keyframes checkDraw { 0%{stroke-dashoffset:60} 60%,100%{stroke-dashoffset:0} }
    @keyframes zeroPulse { 0%,100%{r:18;stroke-opacity:.3} 50%{r:21;stroke-opacity:.6} }
    @keyframes dashMove { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-20} }
    @keyframes scanLine { 0%{y1:105;y2:105} 50%{y1:155;y2:155} 100%{y1:105;y2:105} }
    .shield{animation:shieldGlow 3s ease-in-out infinite}
    .check{stroke-dasharray:60;animation:checkDraw 2s ease-out forwards}
    .zero{animation:zeroPulse 2.5s ease-in-out infinite}
    .z2{animation-delay:1.2s}
    .dash{animation:dashMove 2s linear infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.check{stroke-dashoffset:0}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <path class="shield" d="M300 80 L250 105 L250 155 Q250 190 300 210 Q350 190 350 155 L350 105 Z" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5"/>
  <path class="check" d="M278 145 L293 160 L322 128" fill="none" stroke="rgba(52,211,153,0.9)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="zero" cx="220" cy="130" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle class="zero z2" cx="380" cy="130" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="220" y="136" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700">0</text>
  <text x="380" y="136" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700">0</text>
  <line class="dash" x1="238" y1="130" x2="250" y2="125" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4,4"/>
  <line class="dash" x1="362" y1="130" x2="350" y2="125" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Scan line -->
  <line x1="260" y1="105" x2="340" y2="105" stroke="rgba(52,211,153,0.15)" stroke-width="40">
    <animate attributeName="y1" values="105;155;105" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="105;155;105" dur="3s" repeatCount="indefinite"/>
  </line>
  <rect x="218" y="230" width="164" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="249" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">CYBERSECURITY</text>
</svg>