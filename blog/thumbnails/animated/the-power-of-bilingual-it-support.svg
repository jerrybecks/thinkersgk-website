<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#164e63"/>
      <stop offset="100%" style="stop-color:#0e3d4f"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes bubbleLeft { 0%,100%{transform:translateX(0);opacity:.8} 50%{transform:translateX(-3px);opacity:1} }
    @keyframes bubbleRight { 0%,100%{transform:translateX(0);opacity:.7} 50%{transform:translateX(3px);opacity:1} }
    .bubble-l{animation:bubbleLeft 3s ease-in-out infinite}
    .bubble-r{animation:bubbleRight 3s ease-in-out 0.5s infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <!-- Left speech bubble (EN) -->
  <g class="bubble-l">
    <path d="M218 115 L218 155 C218 160 222 164 227 164 L245 164 L252 175 L255 164 L280 164 C285 164 289 160 289 155 L289 115 C289 110 285 106 280 106 L227 106 C222 106 218 110 218 115Z" fill="none" stroke="rgba(103,232,249,0.7)" stroke-width="2"/>
    <text x="253" y="142" text-anchor="middle" fill="rgba(103,232,249,0.85)" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700">EN</text>
  </g>
  <!-- Right speech bubble (JP) -->
  <g class="bubble-r">
    <path d="M311 125 L311 165 C311 170 315 174 320 174 L348 174 L351 185 L358 174 L373 174 C378 174 382 170 382 165 L382 125 C382 120 378 116 373 116 L320 116 C315 116 311 120 311 125Z" fill="none" stroke="rgba(103,232,249,0.6)" stroke-width="2"/>
    <text x="346" y="156" text-anchor="middle" fill="rgba(103,232,249,0.75)" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700">JP</text>
  </g>
  <!-- Connection dots between bubbles -->
  <circle cx="296" cy="140" r="2" fill="rgba(103,232,249,0.3)"/>
  <circle cx="303" cy="145" r="1.5" fill="rgba(103,232,249,0.25)"/>
  <circle cx="300" cy="135" r="1.5" fill="rgba(103,232,249,0.25)"/>
  <!-- Decorative dots -->
  <circle cx="170" cy="100" r="1.5" fill="rgba(103,232,249,0.15)"/>
  <circle cx="430" cy="110" r="2" fill="rgba(103,232,249,0.1)"/>
  <circle cx="180" cy="195" r="1" fill="rgba(103,232,249,0.15)"/>
  <circle cx="420" cy="185" r="1.5" fill="rgba(103,232,249,0.1)"/>
  <!-- Category pill -->
  <rect x="220" y="240" width="160" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="259" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">BILINGUAL IT</text>
</svg>