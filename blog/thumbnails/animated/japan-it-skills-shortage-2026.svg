  <g class="icon"><circle cx="300" cy="135" r="12" fill="none" stroke="rgba(250,204,21,0.7)" stroke-width="2"/><path d="M275 185 C275 165 325 165 325 185" fill="none" stroke="rgba(250,204,21,0.7)" stroke-width="2"/><circle cx="260" cy="145" r="8" fill="none" stroke="rgba(250,204,21,0.7)" stroke-width="1.5" opacity="0.5"/><circle cx="340" cy="145" r="8" fill="none" stroke="rgba(250,204,21,0.7)" stroke-width="1.5" opacity="0.5"/></g>
