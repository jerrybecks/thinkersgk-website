<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes warnPulse { 0%,100%{opacity:.9} 50%{opacity:.4} }
    @keyframes threatBlink { 0%,20%{opacity:.7;r:3} 10%{opacity:1;r:5} }
    @keyframes shieldDash { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-30} }
    @keyframes scanSweep { 0%,100%{opacity:.3} 50%{opacity:.6} }
    .warn{animation:warnPulse 1.5s ease-in-out infinite}
    .threat{animation:threatBlink 3s ease-in-out infinite}
    .t2{animation-delay:.7s}.t3{animation-delay:1.4s}.t4{animation-delay:2.1s}
    .shield-d{animation:shieldDash 3s linear infinite}
    .scan{animation:scanSweep 2s ease-in-out infinite}
    .sc2{animation-delay:1s}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <path class="warn" d="M300 80 L350 170 L250 170 Z" fill="none" stroke="rgba(251,191,36,0.9)" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="300" y="158" text-anchor="middle" fill="rgba(251,191,36,0.9)" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700">!</text>
  <path class="shield-d" d="M300 65 L240 95 L240 155 Q240 195 300 218 Q360 195 360 155 L360 95 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle class="threat" cx="220" cy="110" r="3" fill="rgba(248,113,113,0.7)"/>
  <circle class="threat t2" cx="200" cy="140" r="2" fill="rgba(248,113,113,0.5)"/>
  <circle class="threat t3" cx="380" cy="105" r="3" fill="rgba(248,113,113,0.7)"/>
  <circle class="threat t4" cx="400" cy="145" r="2" fill="rgba(248,113,113,0.5)"/>
  <line class="scan" x1="215" y1="170" x2="240" y2="155" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <line class="scan sc2" x1="385" y1="170" x2="360" y2="155" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <rect x="218" y="235" width="164" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="254" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">CYBERSECURITY</text>
</svg>