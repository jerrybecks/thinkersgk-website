<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ledBlink { 0%,100%{opacity:.8} 50%{opacity:.3} }
    @keyframes ledBlink2 { 0%,100%{opacity:.8} 30%{opacity:.2} 60%{opacity:.9} }
    @keyframes dashFlow { 0%{stroke-dashoffset:14} 100%{stroke-dashoffset:0} }
    @keyframes endpointPulse { 0%,100%{r:5;opacity:.6} 50%{r:7;opacity:.9} }
    @keyframes ep2 { 0%,100%{r:5;opacity:.6} 50%{r:7;opacity:.9} }
    .led1{animation:ledBlink 1.5s ease-in-out infinite}
    .led2{animation:ledBlink2 2s ease-in-out infinite}
    .led3{animation:ledBlink 1.8s ease-in-out infinite;animation-delay:.4s}
    .led4{animation:ledBlink2 1.6s ease-in-out infinite;animation-delay:.8s}
    .led5{animation:ledBlink 2.2s ease-in-out infinite;animation-delay:.2s}
    .led6{animation:ledBlink2 1.4s ease-in-out infinite;animation-delay:.6s}
    .conn{animation:dashFlow 1.5s linear infinite}
    .conn2{animation:dashFlow 1.5s linear infinite;animation-delay:.5s}
    .conn3{animation:dashFlow 1.5s linear infinite;animation-delay:1s}
    .ep1{animation:endpointPulse 2s ease-in-out infinite}
    .ep2{animation:ep2 2s ease-in-out infinite;animation-delay:.7s}
    .ep3{animation:endpointPulse 2s ease-in-out infinite;animation-delay:1.4s}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <!-- Server stack -->
  <rect x="260" y="75" width="80" height="30" rx="4" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
  <circle class="led1" cx="275" cy="90" r="3" fill="rgba(52,211,153,0.8)"/>
  <circle class="led2" cx="285" cy="90" r="3" fill="rgba(96,165,250,0.8)"/>
  <line x1="300" y1="85" x2="330" y2="85" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="300" y1="92" x2="325" y2="92" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="260" y="110" width="80" height="30" rx="4" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
  <circle class="led3" cx="275" cy="125" r="3" fill="rgba(52,211,153,0.8)"/>
  <circle class="led4" cx="285" cy="125" r="3" fill="rgba(251,191,36,0.8)"/>
  <line x1="300" y1="120" x2="330" y2="120" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="300" y1="127" x2="325" y2="127" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="260" y="145" width="80" height="30" rx="4" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
  <circle class="led5" cx="275" cy="160" r="3" fill="rgba(52,211,153,0.8)"/>
  <circle class="led6" cx="285" cy="160" r="3" fill="rgba(52,211,153,0.8)"/>
  <line x1="300" y1="155" x2="330" y2="155" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="300" y1="162" x2="325" y2="162" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Connection lines with flowing dashes -->
  <line class="conn" x1="340" y1="125" x2="390" y2="95" stroke="rgba(167,139,250,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line class="conn2" x1="340" y1="125" x2="390" y2="125" stroke="rgba(167,139,250,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line class="conn3" x1="340" y1="125" x2="390" y2="155" stroke="rgba(167,139,250,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Endpoint dots with pulse -->
  <circle class="ep1" cx="395" cy="95" r="5" fill="rgba(167,139,250,0.6)"/>
  <circle class="ep2" cx="395" cy="125" r="5" fill="rgba(167,139,250,0.6)"/>
  <circle class="ep3" cx="395" cy="155" r="5" fill="rgba(167,139,250,0.6)"/>
  <!-- Category label -->
  <rect x="205" y="210" width="190" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="229" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">MANAGED SERVICES</text>
</svg>