<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <!-- Hard drive shape -->
  <rect x="250" y="90" width="100" height="80" rx="8" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
  <!-- Platter circles -->
  <circle cx="300" cy="125" r="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="300" cy="125" r="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="300" cy="125" r="3" fill="rgba(255,255,255,0.5)"/>
  <!-- X mark (destruction) -->
  <line x1="265" y1="100" x2="335" y2="160" stroke="rgba(248,113,113,0.9)" stroke-width="3" stroke-linecap="round"/>
  <line x1="335" y1="100" x2="265" y2="160" stroke="rgba(248,113,113,0.9)" stroke-width="3" stroke-linecap="round"/>
  <!-- Shred particles -->
  <rect x="270" y="185" width="8" height="12" rx="1" fill="rgba(255,255,255,0.3)" transform="rotate(15 274 191)"/>
  <rect x="290" y="190" width="8" height="12" rx="1" fill="rgba(255,255,255,0.25)" transform="rotate(-10 294 196)"/>
  <rect x="310" y="187" width="8" height="12" rx="1" fill="rgba(255,255,255,0.3)" transform="rotate(8 314 193)"/>
  <rect x="325" y="192" width="8" height="12" rx="1" fill="rgba(255,255,255,0.2)" transform="rotate(-15 329 198)"/>
  <!-- Category label -->
  <rect x="205" y="235" width="190" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="254" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">DATA MANAGEMENT</text>
</svg>