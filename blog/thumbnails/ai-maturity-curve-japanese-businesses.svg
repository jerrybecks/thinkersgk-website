<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg)"/>
  <!-- Maturity curve (S-curve) -->
  <path d="M180 200 Q220 200 250 190 Q280 175 300 145 Q320 110 350 95 Q380 85 420 82" fill="none" stroke="rgba(96,165,250,0.9)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Axis lines -->
  <line x1="170" y1="210" x2="430" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="170" y1="210" x2="170" y2="70" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Stage markers on curve -->
  <circle cx="200" cy="198" r="5" fill="rgba(248,113,113,0.8)"/>
  <circle cx="270" cy="180" r="5" fill="rgba(251,191,36,0.8)"/>
  <circle cx="330" cy="120" r="5" fill="rgba(52,211,153,0.8)"/>
  <circle cx="400" cy="83" r="5" fill="rgba(96,165,250,0.9)"/>
  <!-- Stage labels -->
  <text x="200" y="225" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,system-ui,sans-serif" font-size="9">Explore</text>
  <text x="270" y="225" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,system-ui,sans-serif" font-size="9">Pilot</text>
  <text x="330" y="225" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,system-ui,sans-serif" font-size="9">Scale</text>
  <text x="400" y="225" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,system-ui,sans-serif" font-size="9">Optimize</text>
  <!-- Category label -->
  <rect x="210" y="250" width="180" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="300" y="269" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">AI &amp; TECH TRENDS</text>
</svg>