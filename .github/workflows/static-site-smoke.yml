name: Static Site Smoke Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run static site validator
        run: python3 scripts/validate_static_site.py
