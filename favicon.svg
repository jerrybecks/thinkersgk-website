<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3460"/>
      <stop offset="100%" stop-color="#1e4080"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="16" fill="url(#bg)"/>

  <!-- Sun dome + rays, centered at (50, 54) -->
  <g transform="translate(50,54)">
    <!-- Dome -->
    <path d="M-20 0 A20 20 0 0 1 20 0 Z" fill="#a8c8f8" opacity="0.92"/>
    <!-- Horizon line -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <!-- Rays — 13 rays matching the real logo -->
    <g stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
      <line x1="0"    y1="-22" x2="0"    y2="-34"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(-15)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(-30)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(-45)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(-60)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(-75)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(-90)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(15)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(30)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(45)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(60)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(75)"/>
      <line x1="-6"   y1="-21" x2="-9"   y2="-33" transform="rotate(90)"/>
    </g>
  </g>

  <!-- Thinker silhouette — matches the real logo's Rodin pose -->
  <g transform="translate(50,56)" fill="white" opacity="0.96">
    <!-- Head -->
    <circle cx="2" cy="-10" r="5.5"/>
    <!-- Torso (hunched forward) -->
    <path d="M-2 -5 C -3 -1, -4 4, -2 9 L 5 9 C 5 4, 4 -1, 4 -5 Z"/>
    <!-- Left arm: elbow on left knee, hand up to chin -->
    <path d="M-2 2 C -9 3, -11 0, -8 -7" stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- Left leg -->
    <path d="M-2 9 L -9 18 L -5 18 L 0 11 Z"/>
    <!-- Right leg -->
    <path d="M5 9 L 10 18 L 14 18 L 7 11 Z"/>
  </g>
</svg>
