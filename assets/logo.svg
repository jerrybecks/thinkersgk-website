<svg viewBox="0 0 280 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4860a" />
      <stop offset="100%" stop-color="#f0a820" />
    </linearGradient>
  </defs>

  <!-- "THIN" text -->
  <text x="50" y="38" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#1e3a6e">THIN</text>

  <!-- Thinker silhouette (replaces K) -->
  <g transform="translate(125, 20)" fill="#1e3a6e">
    <!-- Head (simplified circle) -->
    <circle cx="0" cy="0" r="6"/>
    <!-- Body (simplified rectangle) -->
    <rect x="-4" y="6" width="8" height="10"/>
    <!-- Legs/Base (simplified path for sitting posture) -->
    <path d="M-6 16 C -8 20 -4 24 0 24 C 4 24 8 20 6 16 Z"/>
    <!-- Arm and hand on chin (simplified) -->
    <path d="M-4 8 Q -10 12 -8 16 Q -10 18 -8 20"/>
  </g>

  <!-- Half-sun dome with 13 rays -->
  <g transform="translate(125, 8)">
    <!-- Sun dome -->
    <path d="M-12 0 A 12 12 0 0 1 12 0 Z" fill="url(#sunGradientLight)"/>
    <!-- Rays (13 rays, evenly distributed) -->
    <!-- Angle between rays: 180 / (13-1) = 180 / 12 = 15 degrees -->
    <!-- Start at -90 degrees relative to horizontal, so transform applies to 0 degrees -->
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(-90)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(-75)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(-60)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(-45)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(-30)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(-15)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(0)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(15)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(30)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(45)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(60)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(75)"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="url(#sunGradientLight)" stroke-width="1" transform="rotate(90)"/>
  </g>


  <!-- "ERS" text -->
  <text x="150" y="38" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#1e3a6e">ERS</text>

  <!-- "GK" subtitle -->
  <text x="120" y="52" font-family="Inter, sans-serif" font-size="14" fill="#1e3a6e">GK</text>
</svg>