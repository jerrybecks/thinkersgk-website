      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-weight: 700;
      font-size: 24px;
      fill: currentColor;
    }
    .logo-sub {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
